<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MeLissa — витубер-лисичка. Тёплое пространство для стримов, общения и вайба." />
    <meta name="theme-color" content="#f6ecdc" />
    <script>
      // Применяем тему до рендера, чтобы избежать вспышки
      (function () {
        try {
          var stored = localStorage.getItem('melissa-theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          if (theme === 'dark') document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
    <title>MeLissa — витубер-лисичка</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
